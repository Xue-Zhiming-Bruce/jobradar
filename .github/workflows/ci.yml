# CI: this repository's own runners run the three suites, the committed-data
# guard, the security scan and the stale-contract check. There is no deploy
# step -- deploying a green `main` is #45, which needs #16's Render service and
# Neon database. Nothing in this file reaches a credential beyond the throwaway
# Postgres one below, which the README already publishes for an ephemeral
# container.
#
# What each job runs, and the local command that stands in for it:
#
#   backend      cd backend && uv sync && uv run pytest, against the throwaway
#                server the `integration` block below starts, named by the
#                variable the `engine` matrix reads:
#
#                  cd backend && TEST_DATABASE_URL=postgresql+psycopg://jobradar:jobradar-throwaway@127.0.0.1:5433/jobradar uv run pytest
#
#                one pass over both parameters of the `engine` matrix: the
#                SQLite-only run this job used to be is now the both-engines
#                run, not a second copy of it standing beside. The marked
#                integration suite is still collected and deselected here (`2
#                deselected`), and the run fails on a summary that skipped
#                anything -- an unset variable makes every `[postgres]` case
#                skip, which is the half-run this job exists to catch.
#   frontend     cd frontend && npm ci && npm run build && npm test
#                `npm ci` installs the committed `frontend/package-lock.json`
#   integration  the marked suite against the throwaway server, on port 5433
#                because 5432 is taken on a development machine:
#
#                  docker run --rm -d --name jobradar-test-db -p 5433:5432 \
#                    -e POSTGRES_USER=jobradar -e POSTGRES_PASSWORD=jobradar-throwaway \
#                    -e POSTGRES_DB=jobradar postgres:17
#                  cd backend && TEST_DATABASE_URL=postgresql+psycopg://jobradar:jobradar-throwaway@127.0.0.1:5433/jobradar uv run pytest -m integration
#                  docker rm -f jobradar-test-db
#
#                the job itself uses a service container, not the local compose
#                stack, which the README says is not a test harness
#   contract     cd backend && uv run python -m app.export_openapi
#                git diff --exit-code -- backend/openapi.json
#                a stale or hand-edited contract rewrites the file, so the diff
#                is non-empty and this fails with the diff printed
#
# The `backend` job's first step is the committed-data guard (#19), on its own so
# its verdict is readable without the suite's output, and again inside the suite:
#
#   cd backend && uv run pytest tests/test_committed_data_guard.py
#
# A secret, resume or database file in the git index makes that step red before
# the suite starts. It needs no credential and prints no matched value: the
# failure names the file and the kind.
#
# The `backend` job's next check is the security scan (#82), its own step so a
# finding reads without the suite's output, and at the repository root so every
# path it prints is repository-relative -- `uv run --project backend` uses the
# environment the `uv sync` above already built:
#
#   uv run --project backend ruff check --select S --output-format concise backend/app mcp/jobradar_mcp
#
# `ruff`'s `S` rules are flake8-bandit's checks. They need no network and no key,
# and `ruff` is a backend dev dependency, so the image (`uv sync --no-dev`) never
# carries it. The seven findings this tree had are dispositioned at their own
# sites, so the step is green here and a *new* finding -- a hardcoded password, an
# `xml` parse of untrusted data -- turns it red. The scope and the dispositions
# are `security/scan.md`.
#
# That the YAML itself is valid -- empty output and exit 0 on both files:
#
#   python3 -c 'import yaml, sys; [yaml.safe_load(open(path)) for path in sys.argv[1:]]' .github/workflows/ci.yml .github/workflows/tick.yml
#
# The stronger check, which knows Actions' own schema:
#
#   docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:latest
#
# The versions are this repository's own: Python 3.12 (`requires-python`),
# Node 22.12 (`backend/Dockerfile`) and `postgres:17` (`compose.yaml`). Actions
# are pinned to a released version and never to a branch; setup-uv carries its
# full version because it publishes no moving major tag above `v7`.

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: jobradar
          POSTGRES_PASSWORD: jobradar-throwaway
          POSTGRES_DB: jobradar
        ports:
          - "5432:5432"
        # The health check in `compose.yaml`'s `db` service, with a start period:
        # the suite must not reach a server that is still starting up.
        options: >-
          --health-cmd "pg_isready -U jobradar -d jobradar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 5s
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"
      - run: uv sync
        working-directory: backend
      - name: Fail on a committed secret, resume or database file
        run: uv run pytest tests/test_committed_data_guard.py
        working-directory: backend
      # `backend/tests/conftest.py` skips the whole `[postgres]` parameter when
      # this variable is unset or empty, and pytest core has no fail-on-skip
      # option, so the guard sits on the step that carries the variable: drop
      # the `env:` below and the job is red before the suite starts, rather than
      # green with 369 skipped.
      - name: Fail on a new security scan finding
        run: uv run --project backend ruff check --select S --output-format concise backend/app mcp/jobradar_mcp
      - name: Run the whole suite against the throwaway PostgreSQL
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+psycopg://jobradar:jobradar-throwaway@127.0.0.1:5432/jobradar
        run: |
          set -o pipefail
          test -n "$TEST_DATABASE_URL"
          uv run pytest | tee /tmp/pytest-summary.txt
      # AC2, structural: one complete pass, nothing skipped, a non-zero passed
      # count -- never a pinned total, which another lane's new tests would move.
      - name: Fail when the run skipped anything
        run: |
          grep -qE '[1-9][0-9]* passed' /tmp/pytest-summary.txt
          if grep -qE '[0-9]+ skipped' /tmp/pytest-summary.txt; then
            echo "the suite skipped cases: TEST_DATABASE_URL did not reach it"
            exit 1
          fi

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.12"
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm test
        working-directory: frontend

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: jobradar
          POSTGRES_PASSWORD: jobradar-throwaway
          POSTGRES_DB: jobradar
        ports:
          - "5432:5432"
        # The health check in `compose.yaml`'s `db` service, with a start period:
        # the suite must not reach a server that is still starting up.
        options: >-
          --health-cmd "pg_isready -U jobradar -d jobradar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 5s
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"
      - run: uv sync
        working-directory: backend
      # `backend/tests/integration/conftest.py` fails rather than skips on an
      # unset URL, so a job that lost this variable is red, not green.
      - run: uv run pytest -m integration
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+psycopg://jobradar:jobradar-throwaway@127.0.0.1:5432/jobradar

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"
      - run: uv sync
        working-directory: backend
      - run: uv run python -m app.export_openapi
        working-directory: backend
      - run: git diff --exit-code -- backend/openapi.json
