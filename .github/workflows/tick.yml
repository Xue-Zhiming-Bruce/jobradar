# Tick: one scheduled call to `POST /internal/tick`, so the digest does not depend
# on anyone opening the app. Nothing else: no deploy, no test.
#
# Triggers are one daily cron and a manual dispatch, and nothing else: the secret
# is out of reach of every pull request, and no other event can start this job.
#
# Both inputs are optional configuration. The job reads the repository secret
# `TICK_SECRET` (the value `app/routes/internal.py` reads from the `TICK_SECRET`
# variable, which the README says has no default: unset means every tick is 401) and
# the repository variable `JOBRADAR_URL` (#16 points it at the deployed app). When
# either is unset, empty or whitespace-only the job emits a `::notice::` naming it
# and skips the call, so the daily schedule stays green and emails no failure: the
# repeated red of an unconfigured repository was the problem, exactly as it was for
# `oncall.yml`'s proposal job. Set both under Settings > Secrets and variables >
# Actions to re-enable a real scheduled tick; until then, and for the drifted or
# skipped cron the section below describes, the in-app "Run digest now" button is
# the reliable path. A fully configured repository makes the call below, unchanged,
# and a non-2xx answer still reddens the step. No secret value is in this file --
# both inputs arrive at runtime -- and no step enables shell tracing or a verbose
# transfer, so neither value can reach the log.
#
# The local equivalent of this job, with the app on port 8123 (8000 belongs to
# compose) and a throwaway secret, exactly as the README's MCP demo starts it:
#
#   cd backend && TICK_SECRET=throwaway-local-secret uv run uvicorn app.main:app --port 8123
#
#   curl --fail-with-body --silent --show-error --max-time 60 \
#     --request POST --header "X-Tick-Secret: throwaway-local-secret" \
#     http://127.0.0.1:8123/internal/tick
#   curl --silent --show-error --max-time 60 http://127.0.0.1:8123/runs/1
#
# The first is the call this job makes, and it has to answer 202: the endpoint
# fails a wrong or absent secret with 401, a run already in progress with 409 and
# an unrecorded run with 500, and `--fail-with-body` fails the step on every one
# of them. It answers 202 while the run continues in the background, so the second
# curl is where that run's outcome is read -- not this job's business.
#
# That the YAML itself is valid -- empty output and exit 0 on both files:
#
#   python3 -c 'import yaml, sys; [yaml.safe_load(open(path)) for path in sys.argv[1:]]' .github/workflows/ci.yml .github/workflows/tick.yml
#
# The stronger check, which knows Actions' own schema:
#
#   docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:latest
#
# The schedule is best-effort. GitHub Actions cron drifts by minutes to hours and
# can skip a run entirely, so a missed or late run is expected and the in-app
# "Run digest now" button is the reliable path
# (_docs/decisions/2026-10-11-deploy-and-repo.md).

name: Tick

on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      # Both inputs are checked before anything is sent. Either one missing means no
      # tick can be made, so the step names it in a `::notice::` and exports whether
      # both resolved; that output guards the call below, so an unconfigured run
      # issues no `curl` at all and the run conclusion stays `success`.
      - name: Check TICK_SECRET and JOBRADAR_URL
        id: configuration
        env:
          TICK_SECRET: ${{ secrets.TICK_SECRET }}
          JOBRADAR_URL: ${{ vars.JOBRADAR_URL }}
        run: |
          # Whitespace-only resolves the same as unset, as it does in `oncall.yml`'s guard;
          # a blank value would reach `curl` as an empty header and a bare `/internal/tick`.
          configured=true
          if [[ -z "${TICK_SECRET//[[:space:]]/}" ]]; then
            echo "::notice::TICK_SECRET is unset or empty, so the scheduled tick is disabled until it is set under Settings > Secrets and variables > Actions, and no request was sent. The in-app \"Run digest now\" button is the reliable path meanwhile."
            configured=false
          fi
          if [[ -z "${JOBRADAR_URL//[[:space:]]/}" ]]; then
            echo "::notice::JOBRADAR_URL is unset or empty, so the scheduled tick is disabled until it is set under Settings > Secrets and variables > Actions, and no request was sent. The in-app \"Run digest now\" button is the reliable path meanwhile."
            configured=false
          fi
          echo "configured=${configured}" >> "$GITHUB_OUTPUT"

      - name: Start one run
        if: steps.configuration.outputs.configured == 'true'
        env:
          TICK_SECRET: ${{ secrets.TICK_SECRET }}
          JOBRADAR_URL: ${{ vars.JOBRADAR_URL }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 60 \
            --request POST \
            --header "X-Tick-Secret: ${TICK_SECRET}" \
            "${JOBRADAR_URL}/internal/tick"
