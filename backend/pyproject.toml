[project]
name = "jobradar-backend"
version = "0.1.0"
description = "JobRadar backend: FastAPI service that polls job boards and scores matches."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "psycopg[binary]>=3.2,<4.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13,<3.0",
    "pytest>=8.0,<9.0",
]

# The backend is an application, not a distributable package: uv installs
# dependencies only and never builds or installs this project itself.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
