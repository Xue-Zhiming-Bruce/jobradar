[project]
name = "jobradar-backend"
version = "0.1.0"
description = "JobRadar backend: FastAPI service that polls job boards and scores matches."
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20,<2.0",
    "fastapi>=0.115,<1.0",
    "httpx2>=2.13,<3.0",
    "jobradar-mcp",
    "mcp>=2.3,<3.0",
    "pillow>=11,<12",
    "pillow-heif>=1.8,<2.0",
    "psycopg[binary]>=3.2,<4.0",
    "pypdf>=5,<6",
    "python-multipart>=0.0.20,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.30,<1.0",
]

# The hosted MCP endpoint (#43) mounts `mcp/`'s tools into this app's process, so
# the MCP SDK and the tool source are importable here, in the runtime image too.
# This deliberately reverses #17's isolation, in which the `mcp` dependency never
# entered this tree or that image; the decision is
# `_docs/decisions/2026-10-14-hosted-mcp.md`. `mcp/` stays the one implementation
# of the tools and this path source keeps them from being copied.
[tool.uv.sources]
jobradar-mcp = { path = "../mcp", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
    "ruff>=0.14,<0.15",
]

# The backend is an application, not a distributable package: uv installs
# dependencies only and never builds or installs this project itself.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# `tests/integration/` is the one suite that needs a real PostgreSQL server, so
# it is excluded from the default run by its marker rather than by its path: the
# directory is still collected (and reported as deselected, which is how the
# default run shows it exists), and `pytest -m integration` -- a command-line
# `-m` replaces this one -- runs it alone.
addopts = "-m 'not integration'"
markers = [
    "integration: drives the real app end to end against a real PostgreSQL server; runs only under `pytest -m integration`",
]
