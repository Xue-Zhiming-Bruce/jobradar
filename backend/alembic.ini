# Alembic's own configuration: where the revision history lives, and nothing
# about a particular database.
#
# There is deliberately no `sqlalchemy.url` here. `migrations/env.py` takes the
# URL from `app.db.database_url()` -- the app's own function -- so `DATABASE_URL`
# stays the only connection input, and this file, committed to a public
# repository, carries no URL and no credential.
#
# Every command below is run from `backend/`, which is the directory this file
# sits in, so `prepend_sys_path = .` is what lets `env.py` import `app`.

[alembic]
# `migrations/` beside this file: `env.py`, `script.py.mako` and `versions/`.
script_location = migrations

# The backend root, so `app` is importable however alembic was started.
prepend_sys_path = .

path_separator = os

# Logging, so `alembic upgrade head` says which revision it ran. `env.py` calls
# `fileConfig` with this file's name for exactly that.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
